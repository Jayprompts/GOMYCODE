<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Dictionary</title>
    <link rel = "stylesheet" href = "style.css">
</head>
<body>
    <div class = "container">
        <h1>English Dictionary</h1>
        <input type = "text" class = "input" id = "input" placeholder="Search for a word">
        <p class = "info-text" id = "info-text">Type a word and press enter</p>
        <div class = "meaning-container" id = "meaning-container">
            <p>Word: <span id = "title">_</span></p>
            <p>Meaning: <span id = "meaning">_</span></p>
            <audio src = "" id = "audio" class = "hidden" controls></audio>
        </div>
    </div>

    <script src = "index.js"></script>
</body>
</html>
