<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="#0f172a" rx="16" />
  <rect x="20" y="20" width="560" height="320" rx="12" fill="#1e293b" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
  
  <!-- Browser Chrome Mockup -->
  <circle cx="50" cy="45" r="6" fill="#ef4444" />
  <circle cx="68" cy="45" r="6" fill="#f59e0b" />
  <circle cx="86" cy="45" r="6" fill="#10b981" />
  <rect x="115" y="36" width="300" height="18" rx="6" fill="#0f172a" opacity="0.6" />
  <text x="125" y="50" fill="#94a3b8" font-family="monospace" font-size="11">https://studio.ai-prompt.app</text>

  <!-- Central AI Neural Graphic -->
  <circle cx="300" cy="190" r="70" fill="url(#aiGrad)" opacity="0.8" />
  <circle cx="300" cy="190" r="55" fill="#0f172a" />
  <text x="300" y="196" fill="#c084fc" font-family="sans-serif" font-size="28" font-weight="bold" text-anchor="middle">AI</text>
  
  <!-- Radiating Nodes -->
  <line x1="230" y1="190" x2="160" y2="140" stroke="#6366f1" stroke-width="2" stroke-dasharray="4,4" />
  <circle cx="160" cy="140" r="14" fill="#6366f1" />
  <line x1="370" y1="190" x2="440" y2="140" stroke="#ec4899" stroke-width="2" stroke-dasharray="4,4" />
  <circle cx="440" cy="140" r="14" fill="#ec4899" />
  <line x1="300" y1="260" x2="300" y2="300" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4,4" />
  <circle cx="300" cy="300" r="14" fill="#06b6d4" />
</svg>
