<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="jacketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle with Glow -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGrad)" />
  <circle cx="200" cy="200" r="175" fill="#0b0f19" opacity="0.85" />

  <!-- Abstract Tech Grid Lines in Background -->
  <path d="M 60 200 H 340 M 200 60 V 340" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
  <circle cx="200" cy="200" r="130" stroke="rgba(99,102,241,0.25)" stroke-width="2" fill="none" stroke-dasharray="6,6" />

  <!-- Developer Silhouette / Illustration -->
  <!-- Shoulders / Jacket -->
  <path d="M 110 360 C 110 280, 150 250, 200 250 C 250 250, 290 280, 290 360 Z" fill="url(#jacketGrad)" stroke="#38bdf8" stroke-width="3" />
  
  <!-- Hoodie / Inner Shirt -->
  <polygon points="175,250 225,250 200,320" fill="#6366f1" />

  <!-- Neck -->
  <rect x="182" y="210" width="36" height="45" rx="8" fill="#f87171" opacity="0.9" />

  <!-- Head -->
  <ellipse cx="200" cy="170" rx="60" ry="70" fill="#fbcfe8" />

  <!-- Hair -->
  <path d="M 138 165 C 135 110, 160 90, 200 90 C 240 90, 265 110, 262 165 C 255 145, 240 135, 200 135 C 160 135, 145 145, 138 165 Z" fill="#1e1b4b" />

  <!-- Glasses -->
  <rect x="155" y="160" width="38" height="24" rx="6" fill="rgba(6,182,212,0.2)" stroke="#06b6d4" stroke-width="3" />
  <rect x="207" y="160" width="38" height="24" rx="6" fill="rgba(6,182,212,0.2)" stroke="#06b6d4" stroke-width="3" />
  <line x1="193" y1="172" x2="207" y2="172" stroke="#06b6d4" stroke-width="3" />

  <!-- Smile -->
  <path d="M 185 210 Q 200 222 215 210" stroke="#991b1b" stroke-width="3" fill="none" stroke-linecap="round" />

  <!-- Floating Tech Badges -->
  <g transform="translate(65, 90)">
    <rect width="65" height="30" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="32" y="20" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">React</text>
  </g>
  <g transform="translate(270, 95)">
    <rect width="65" height="30" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="1.5" />
    <text x="32" y="20" fill="#ec4899" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Next.js</text>
  </g>
  <g transform="translate(280, 260)">
    <rect width="65" height="30" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <text x="32" y="20" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Node</text>
  </g>
</svg>
