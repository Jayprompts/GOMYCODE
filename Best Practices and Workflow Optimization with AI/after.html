<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Refactored and responsive pricing card component showcasing modern CSS, accessibility, and JavaScript component reusability.">
  <title>Refactored Reusable Pricing Card Component</title>

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       Design Tokens & Reset
       ========================================================================== */
    :root {
      --bg-gradient: radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.08) 0%, transparent 40%),
                     radial-gradient(circle at 90% 80%, rgba(236, 72, 153, 0.06) 0%, transparent 40%),
                     #f8fafc;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --card-border-popular: #6366f1;
      
      --text-main: #0f172a;
      --text-muted: #64748b;
      
      --accent-primary: #4f46e5;
      --accent-hover: #4338ca;
      --accent-gradient: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      
      --success-color: #10b981;
      --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
      --shadow-popular: 0 20px 30px -10px rgba(99, 102, 241, 0.25);
      
      --radius-md: 16px;
      --radius-sm: 10px;
      --radius-full: 9999px;
      --transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
      line-height: 1.5;
    }

    /* Page Header */
    .page-header {
      text-align: center;
      max-width: 600px;
      margin-bottom: 3rem;
    }

    .badge-tag {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent-primary);
      background: rgba(79, 70, 229, 0.1);
      padding: 0.35rem 0.85rem;
      border-radius: var(--radius-full);
      margin-bottom: 0.75rem;
    }

    .page-title {
      font-size: 2.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-main);
      margin-bottom: 0.75rem;
    }

    .page-subtitle {
      font-size: 1rem;
      color: var(--text-muted);
    }

    /* ==========================================================================
       Reusable Pricing Grid & Card Component
       ========================================================================== */
    .pricing-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 320px));
      gap: 2rem;
      justify-content: center;
      width: 100%;
      max-width: 1060px;
    }

    .pricing-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm); /* Fixed typo: box-shdow -> box-shadow */
      padding: 2rem 1.75rem;
      text-align: left;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: var(--transition);
      overflow: hidden;
    }

    .pricing-card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-lg);
      border-color: #cbd5e1;
    }

    /* Featured/Popular Tier Enhancement */
    .pricing-card.is-popular {
      border-color: var(--card-border-popular);
      box-shadow: var(--shadow-popular);
    }

    .popular-ribbon {
      position: absolute;
      top: 1rem;
      right: 1.25rem;
      background: var(--accent-gradient);
      color: #ffffff;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.25rem 0.75rem;
      border-radius: var(--radius-full);
      box-shadow: 0 4px 10px rgba(99, 102, 241, 0.3);
    }

    .pricing-header {
      margin-bottom: 1.5rem;
    }

    .pricing-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 0.35rem;
    }

    .pricing-desc {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .pricing-price-wrap {
      display: flex;
      align-items: baseline;
      gap: 0.35rem;
      margin-bottom: 1.75rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid #f1f5f9;
    }

    .pricing-currency {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .pricing-amount {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.03em;
    }

    .pricing-period {
      font-size: 0.9rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Features List */
    .pricing-features {
      list-style: none;
      padding-left: 0;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      margin-bottom: 2rem;
      flex-grow: 1;
    }

    .pricing-feature-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.9375rem;
      color: #334155;
    }

    .check-icon {
      width: 18px;
      height: 18px;
      color: var(--success-color);
      flex-shrink: 0;
    }

    /* Responsive, Interactive Button */
    .pricing-btn {
      width: 100%;
      background: #f1f5f9;
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.9375rem;
      font-weight: 600;
      padding: 0.85rem 1.5rem;
      border: 1px solid #e2e8f0;
      border-radius: var(--radius-sm);
      cursor: pointer; /* Added missing cursor pointer */
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .pricing-btn:hover {
      background: #e2e8f0;
      color: var(--text-main);
      transform: translateY(-1px);
    }

    .pricing-btn:active {
      transform: translateY(0);
    }

    /* Highlighted Button for Featured Tier */
    .pricing-card.is-popular .pricing-btn {
      background: var(--accent-gradient);
      color: #ffffff;
      border: none;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.35);
    }

    .pricing-card.is-popular .pricing-btn:hover {
      filter: brightness(1.1);
      box-shadow: 0 6px 16px rgba(79, 70, 229, 0.45);
    }

    /* Feedback Toast Notification */
    .toast-alert {
      position: fixed;
      bottom: 24px;
      background: #0f172a;
      color: #ffffff;
      padding: 0.85rem 1.5rem;
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      font-weight: 500;
      box-shadow: var(--shadow-lg);
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 1000;
      pointer-events: none;
    }

    .toast-alert.show {
      transform: translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <header class="page-header">
    <span class="badge-tag">Refactored &amp; Modular</span>
    <h1 class="page-title">Flexible Pricing Options</h1>
    <p class="page-subtitle">Demonstration of the refactored, responsive, and reusable Card component with interactive event handling.</p>
  </header>

  <!-- Reusable Card Component Target Container -->
  <main class="pricing-grid" id="pricingContainer" aria-label="Subscription Plans">
    <!-- Rendered dynamically by Card(title, price, features, options) -->
  </main>

  <!-- Toast Notification Feedback -->
  <div id="toastAlert" class="toast-alert" role="status" aria-live="polite"></div>

  <script>
    /**
     * Reusable Pricing Card Component Function
     * @param {Object} props
     * @param {string} props.title - Plan name (e.g. 'Basic Plan')
     * @param {string|number} props.price - Price amount (e.g. '9.99')
     * @param {string} [props.period] - Billing period (default '/month')
     * @param {string} [props.description] - Short subtitle description
     * @param {string[]} props.features - Array of feature strings
     * @param {string} [props.buttonText] - Call to action text
     * @param {boolean} [props.isPopular] - Highlights card as featured
     * @param {Function} [props.onSelect] - Click callback handler
     * @returns {HTMLElement} - Rendered card DOM element
     */
    function Card({
      title,
      price,
      period = '/month',
      description = 'Essential tools to get started.',
      features = [],
      buttonText = 'Start Trial',
      isPopular = false,
      onSelect
    }) {
      const card = document.createElement('article');
      card.className = `pricing-card ${isPopular ? 'is-popular' : ''}`;

      // Checkmark SVG Icon for features
      const checkSvg = `
        <svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      `;

      card.innerHTML = `
        ${isPopular ? '<span class="popular-ribbon">Most Popular</span>' : ''}
        <header class="pricing-header">
          <!-- Fixed bug: Closed h2 tag properly instead of stray <h2> opening tag -->
          <h2 class="pricing-title">${escapeHtml(title)}</h2>
          <p class="pricing-desc">${escapeHtml(description)}</p>
        </header>

        <div class="pricing-price-wrap">
          <span class="pricing-currency">$</span>
          <span class="pricing-amount">${escapeHtml(String(price))}</span>
          <span class="pricing-period">${escapeHtml(period)}</span>
        </div>

        <ul class="pricing-features">
          ${features
            .map((feat) => `<li class="pricing-feature-item">${checkSvg}<span>${escapeHtml(feat)}</span></li>`)
            .join('')}
        </ul>

        <button class="pricing-btn" type="button" aria-label="Select ${escapeHtml(title)}">
          <span>${escapeHtml(buttonText)}</span>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      `;

      // Event listener resolving unresponsive button bug
      const btn = card.querySelector('.pricing-btn');
      btn.addEventListener('click', () => {
        if (typeof onSelect === 'function') {
          onSelect({ title, price });
        } else {
          showFeedbackToast(`Selected: ${title} ($${price}${period})`);
        }
      });

      return card;
    }

    // Helper: HTML escaping to prevent XSS
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // Toast Feedback Function
    let toastTimer;
    function showFeedbackToast(message) {
      const toast = document.getElementById('toastAlert');
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('show');
      }, 3500);
    }

    // ==========================================================================
    // Demonstrating Reusability with Multiple Plans
    // ==========================================================================
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('pricingContainer');

      const plans = [
        {
          title: 'Basic Plan',
          price: '9.99',
          description: 'Perfect for individual builders and exploration.',
          features: ['1 GB Storage', 'Basic Support', 'All Core Features', 'Standard Speed'],
          buttonText: 'Start Trial',
          isPopular: false,
        },
        {
          title: 'Pro Plan',
          price: '24.99',
          description: 'Designed for scaling projects and high workloads.',
          features: ['25 GB Storage', 'Priority 24/7 Support', 'All Core Features', 'Advanced AI Tools', 'Unlimited Bandwidth'],
          buttonText: 'Get Started',
          isPopular: true,
        },
        {
          title: 'Enterprise',
          price: '79.99',
          description: 'Comprehensive dedicated solutions for enterprise teams.',
          features: ['Unlimited Storage', 'Dedicated Account Manager', 'Custom API Integrations', '99.99% SLA Uptime Guarantee'],
          buttonText: 'Contact Sales',
          isPopular: false,
        }
      ];

      plans.forEach((plan) => {
        const cardElement = Card(plan);
        container.appendChild(cardElement);
      });
    });
  </script>
</body>
</html>
